name: Package check

# `check` is a dry run. -d is the real no-upload switch: merely leaving
# CF_API_KEY out still lets the packager cut a GitHub release - with the WHOLE
# CHANGELOG.md as its notes. CurseForge keeps building releases with its own
# packager from the tag webhook.
#
# On a tag, once `check` has passed, the zip it built and checked is published
# twice more, never rebuilt: `release` makes the GitHub Release (with
# release.json), `wago` uploads to Wago Addons. The packager stays out of both.
# From the template in References\Docs\release (RELEASING.md §2, #23).
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  # Publish an existing tag again where it failed. Run it from main: `check`
  # builds the tag's tree, notes included.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish (e.g. v1.2.0)
        required: true
      publish:
        description: Where to publish it
        type: choice
        options: [both, github, wago]
        default: both

permissions:
  contents: read

env:
  ADDON: Stakeout

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Empty except on a manual run, so checkout keeps its default: the
          # commit that triggered the run (a branch ref would build its tip).
          ref: ${{ inputs.tag }}

      - name: Install Lua 5.1
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1

      # The embedded LibGlass-1.0 at the tag .pkgmeta pins (read from there,
      # never written twice), checked to BE that commit. The tests load it
      # from $LIBGLASS; the packager fetches the same pin into Libs/LibGlass-1.0.
      - name: Fetch LibGlass at the pinned ref
        run: |
          bash tests/fetch_libglass.sh "$RUNNER_TEMP/LibGlass"
          echo "LIBGLASS=$RUNNER_TEMP/LibGlass" >> "$GITHUB_ENV"

      # Every Lua file the TOC loads (what ships), then the probe. The library
      # is checked in its own repo.
      - name: Syntax-check the Lua
        run: |
          src=$(tr -d '\r' < Stakeout.toc | grep -v '^#' | grep '\.lua$')
          test -n "$src" || { echo "the TOC lists no Lua file - the check would prove nothing"; exit 1; }
          luac5.1 -p $src $(find Tools -name '*.lua' 2>/dev/null)

      - name: Unit tests
        env:
          FOREVERPROBE_OPTIONAL: "1"   # ForeverProbe is private and local: the probe tests run locally
        run: |
          for f in tests/test_*.lua; do
            echo "-- $f"
            lua5.1 "$f" || exit 1
          done

      # On a manual run GITHUB_REF is main, and the packager names the build
      # after whichever tag at HEAD it sorts first (release.sh 613-628 prefers
      # GITHUB_REF_NAME only on a tag push). An alpha promoted to a release
      # without a code change puts two tags on one commit, so drop the others
      # from this checkout: the zip and its TOC version are the requested tag's.
      - name: Only the requested tag at HEAD
        if: inputs.tag != ''
        env:
          TAG: ${{ inputs.tag }}
        run: |
          for t in $(git tag --points-at HEAD); do
            [ "$t" = "$TAG" ] || git tag -d "$t"
          done
          test "$(git tag --points-at HEAD)" = "$TAG" || { echo "$TAG is not at HEAD"; exit 1; }

      # Pinned to a SHA, not the moving v2 tag.
      - name: Package (dry run)
        uses: BigWigsMods/packager@e50a250f8705041e40f2fa1ddcb280a686d65aa0
        with:
          args: -d

      # Players get exactly the TOC, our LICENSE, the Lua it loads, and under
      # Libs/LibGlass-1.0 exactly what the library ships: its XML, every file
      # the XML loads, LICENSE and Media/*.tga. Anything else in the zip means
      # .pkgmeta's ignore list missed something (tests, tools, notes). The
      # version is substituted: no @project-version@ left in the TOC.
      - name: The package is exactly the addon and its library
        run: |
          zip=$(ls .release/*.zip | head -1)
          rm -rf unpacked && mkdir unpacked && unzip -q "$zip" -d unpacked
          lib=Stakeout/Libs/LibGlass-1.0
          {
            echo Stakeout/Stakeout.toc
            echo Stakeout/LICENSE
            tr -d '\r' < Stakeout.toc | grep -v '^#' | grep -v '^$' | tr '\' '/' | sed 's|^|Stakeout/|'
            echo "$lib/LICENSE"
            # Comments stripped non-greedily (a sed range would swallow the
            # lines after a one-line comment).
            tr -d '\r' < "$LIBGLASS/LibGlass-1.0.xml" | perl -0pe 's/<!--.*?-->//gs' |
              sed -n 's/.*<Script file="\([^"]*\)".*/\1/p' | tr '\' '/' | sed "s|^|$lib/|"
            (cd "$LIBGLASS" && ls Media/*.tga) | sed "s|^|$lib/|"
          } | sort > expected.txt
          (cd unpacked && find . -type f | sed 's|^\./||' | sort) > actual.txt
          echo "library files expected: $(grep -c "^$lib/" expected.txt) ($(grep -c "^$lib/Media/" expected.txt) textures)"
          if ! diff -u expected.txt actual.txt; then
            echo "the package differs from the addon + library (- missing, + extra)"
            exit 1
          fi
          if grep -q '@project-version@' unpacked/Stakeout/Stakeout.toc; then
            echo "the packaged TOC still holds @project-version@"
            exit 1
          fi

      # The packager fetched its own copy of the library; prove it embedded the
      # pinned commit's content (the files the tests just ran against). Its
      # text filter rewrites .lua/.xml with CRLF, so those compare with CRs
      # stripped; textures and LICENSE must match byte for byte.
      - name: The packaged library is the pinned commit
        run: |
          lib=unpacked/Stakeout/Libs/LibGlass-1.0
          bad=0
          while read -r f; do
            case "$f" in
              *.lua|*.xml) cmp -s <(tr -d '\r' < "$lib/$f") <(tr -d '\r' < "$LIBGLASS/$f") ;;
              *) cmp -s "$lib/$f" "$LIBGLASS/$f" ;;
            esac || { echo "differs from the pinned checkout: $f"; bad=1; }
          done < <(cd "$lib" && find . -type f | sed 's|^\./||')
          test "$bad" -eq 0

      # What a tag publishes next to the zip, from the tag's own CHANGELOG.md,
      # built on every run so a changelog heading or TOC field that breaks it
      # fails on the pull request. Off a tag there is no tag section, so it
      # reads the newest one. `release` and `wago` publish these very files.
      # The script is the workflow's own (GITHUB_SHA), not the checked-out
      # tree's: a manual run checks out the requested tag, and a tag from
      # before the script has none (Codex, NodeRadar #36).
      - name: The release notes and release.json build
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
        run: |
          zip=$(ls .release/*.zip | head -1)
          tag="$TAG"
          if [ -z "$tag" ]; then
            tag=$(tr -d '\r' < CHANGELOG.md | sed -n 's/^## \(v[^ ]*\).*/\1/p' | head -1)
          fi
          git show "$GITHUB_SHA:tests/release_files.sh" > "$RUNNER_TEMP/release_files.sh"
          bash "$RUNNER_TEMP/release_files.sh" "$tag" "$zip" "$RUNNER_TEMP/release-files"

      # .release is a hidden directory, and upload-artifact@v4 skips hidden
      # content by default - without include-hidden-files the upload finds
      # nothing. `warn` then leaves the job green while publishing no artifact.
      - name: Keep the zip for inspection
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: .release/*.zip
          include-hidden-files: true
          if-no-files-found: error

      - name: Keep the notes and release.json for the publishers
        uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: ${{ runner.temp }}/release-files/
          if-no-files-found: error

  # A GitHub Release for every tag: the zip `check` built and checked,
  # release.json, and the tag's CHANGELOG.md section as the notes. The only job
  # allowed to write to the repository.
  release:
    needs: check
    if: >-
      (github.event_name == 'push' && github.ref_type == 'tag') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish != 'wago')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      # Everything comes from `check`'s artifacts - the zip, and the notes and
      # release.json it built from the tag's tree - so there is no checkout:
      # on a manual run from main, one would read main's CHANGELOG.md.
      - uses: actions/download-artifact@v4
        with:
          name: package
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: out

      - name: The zip and release.json are the tag's
        run: |
          ls dist out
          zip="dist/$ADDON-$TAG-forever.zip"
          test -f "$zip" || { echo "no $zip"; exit 1; }
          jq -e --arg v "$TAG" --arg f "${zip#dist/}" \
            '.releases[0].version == $v and .releases[0].filename == $f' out/release.json > /dev/null ||
            { echo "release.json is not $TAG's:"; cat out/release.json; exit 1; }
          echo "ZIP=$zip" >> "$GITHUB_ENV"

      # The title is release.json's name: the packaged TOC's Title, colour
      # codes stripped.
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=
          case "${TAG,,}" in *alpha*|*beta*) pre=--prerelease ;; esac
          title="$(jq -r '.releases[0].name' out/release.json) ${TAG#v}"
          gh release create "$TAG" "$ZIP" out/release.json --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$title" --notes-file out/notes.md $pre

  # The same zip on Wago Addons, through its upload API - the request the
  # packager's upload_wago makes, minus its two problems: it would package a
  # second, unchecked zip, and send the whole CHANGELOG.md as the changelog.
  # Only this job sees WAGO_API_TOKEN.
  wago:
    needs: check
    if: >-
      (github.event_name == 'push' && github.ref_type == 'tag') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish != 'github')
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      # As in `release`: `check`'s artifacts only, no checkout.
      - uses: actions/download-artifact@v4
        with:
          name: package
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: out

      - name: The zip and release.json are the tag's
        run: |
          zip="dist/$ADDON-$TAG-forever.zip"
          test -f "$zip" || { echo "no $zip"; exit 1; }
          jq -e --arg v "$TAG" --arg f "${zip#dist/}" \
            '.releases[0].version == $v and .releases[0].filename == $f' out/release.json > /dev/null ||
            { echo "release.json is not $TAG's:"; cat out/release.json; exit 1; }
          echo "ZIP=$zip" >> "$GITHUB_ENV"

      # The project is the packaged TOC's X-Wago-ID. Each interface becomes the
      # patch Wago names it by (16001 -> 1.60.1), which must be one Wago lists
      # for Forever: the packager would fall back to a neighbouring patch, but a
      # new client build Wago doesn't know yet should stop here instead. Run the
      # tag again (workflow_dispatch, wago) once Wago lists it.
      - name: The Wago upload metadata
        run: |
          id=$(unzip -p "$ZIP" "$ADDON/$ADDON.toc" | tr -d '\r' | sed -n 's/^## X-Wago-ID: *//p' | head -1)
          test -n "$id" || { echo "the packaged TOC has no X-Wago-ID"; exit 1; }
          echo "WAGO_ID=$id" >> "$GITHUB_ENV"
          known=$(curl -sS --fail --retry 3 https://addons.wago.io/api/data/game | jq -c '.patches.forever // []')
          echo "Wago's Forever patches: $known"
          patches=()
          for i in $(jq -r '.releases[0].metadata[].interface' out/release.json); do
            p=$(printf '%d.%d.%d' $((i / 10000)) $((i / 100 % 100)) $((i % 100)))
            jq -e --arg p "$p" 'index($p) != null' <<< "$known" > /dev/null ||
              { echo "Wago lists no Forever patch $p (interface $i)"; exit 1; }
            patches+=("$p")
          done
          case "${TAG,,}" in *alpha*) stability=alpha ;; *beta*) stability=beta ;; *) stability=stable ;; esac
          jq -n --arg label "$TAG" --arg stability "$stability" --rawfile changelog out/notes.md \
            --argjson patches "$(printf '%s\n' "${patches[@]}" | jq -R . | jq -s .)" \
            '{label: $label, stability: $stability, changelog: $changelog,
              supported_forever_patches: $patches}' > out/metadata.json
          cat out/metadata.json

      - name: Upload to Wago Addons
        env:
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
        run: |
          test -n "$WAGO_API_TOKEN" || { echo "the WAGO_API_TOKEN secret is not set"; exit 1; }
          code=$(curl -sS --retry 3 --retry-delay 10 -o out/result.json -w '%{http_code}' \
            -H "authorization: Bearer $WAGO_API_TOKEN" \
            -H 'accept: application/json' \
            -F 'metadata=<out/metadata.json' \
            -F "file=@$ZIP" \
            "https://addons.wago.io/api/projects/$WAGO_ID/version")
          echo "HTTP $code"
          case "$code" in
            200|201) echo "uploaded: https://addons.wago.io/addons/$WAGO_ID" ;;
            *) cat out/result.json 2>/dev/null; exit 1 ;;
          esac
